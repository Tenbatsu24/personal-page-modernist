<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <title>{{ page.title | default: site.title }}{% if page.title %} | {% endif %}{{ site.title }}</title>
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/" />
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="{{ site.author.name }}">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
    <meta property="og:title" content="{{ page.title | default: site.title }}{% if page.title %} | {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/profile.jpg">

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="{{ page.title | default: site.title }}{% if page.title %} | {% endif %}{{ site.title }}">
    <meta property="twitter:description" content="{{ page.description | default: site.description }}">
    <meta property="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/profile.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/images/favicon.png">
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/images/favicon.png">

    <!-- Theme colors -->
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/stylesheets/github-light.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/stylesheets/pygment_trac.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Theme toggle button -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode">
      <span class="icon-sun" title="Light mode">&#9725;</span>
      <span class="icon-moon" title="Dark mode">&#9790;</span>
    </button>

    <!-- Navigation -->
    <nav class="main-nav">
      <div class="nav-inner">
        <a href="{{ site.baseurl }}/" class="nav-brand">{{ site.title }}</a>
        <ul class="nav-links">
          <li><a href="{{ site.baseurl }}/">Home</a></li>
          <li><a href="{{ site.baseurl }}/blog/">Blog</a></li>
          <li><a href="{{ site.baseurl }}/projects/">Projects</a></li>
          <li><a href="{{ site.baseurl }}/cv/">CV</a></li>
        </ul>
      </div>
    </nav>

    {{ content }}

    <!-- Scripts -->
    <script src="{{ site.baseurl }}/assets/js/theme-toggle.js"></script>
  </body>
</html>
