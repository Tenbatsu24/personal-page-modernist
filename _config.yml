# Jekyll configuration — GitHub Pages compatible
# Site settings
title: Your Name
email: you@yourdomain.edu
description: >-
  A brief description — e.g. PhD researcher working on AI, machine learning, and computational neuroscience.
baseurl: "" # Set to "/modernist" if deploying as a subproject; leave empty for <username>.github.io
url: "" # Set to "https://yourusername.github.io" when deploying

# Author profile
author:
  name: Your Name
  twitter: yourtwitterhandle
  github: yourgithubusername
  linkedin: yourlinkedinhandle

# SCSS settings
sass:
  sass_dir: _sass
  style: compressed

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Markdown
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    style: monokai

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      categories: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# Exclude from processing
exclude:
  - README.md
  - plans/
  - .idea/
